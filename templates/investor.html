<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investor Dashboard | Investment Management</title>
  
  <!-- Bootstrap 5 CSS & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="alert-container"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/investor">
        <i class="bi bi-graph-up-arrow text-info me-2"></i>
        <span>InvestSys</span>&nbsp;Investor Portal
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#investorNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="investorNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#section-wallet"><i class="bi bi-wallet2 me-1"></i> Wallet</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#section-projects"><i class="bi bi-folder-symlink me-1"></i> Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#section-transactions"><i class="bi bi-clock-history me-1"></i> History</a>
          </li>
        </ul>
        
        <div class="d-flex align-items-center gap-3">
          <div class="text-end d-none d-sm-block">
            <div class="fw-semibold text-white" id="investor-user-name">Investor User</div>
            <div class="text-secondarySmall text-light small" id="investor-user-email">investor@example.com</div>
          </div>
          <button class="btn btn-outline-light btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container py-4">
    
    <!-- 2. Wallet Info Stat Card -->
    <div class="row mb-4" id="section-wallet">
      <div class="col-12">
        <div class="stat-card">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
              <div class="stat-card-title d-flex align-items-center gap-2">
                <span>Active Wallet Balance</span>
                <span class="badge bg-success text-white small" id="active-wallet-badge"><i class="bi bi-check-circle-fill me-1"></i>Active</span>
              </div>
              <div class="stat-card-value" id="investor-wallet-balance">$0.00</div>
            </div>
            
            <div class="d-flex align-items-center gap-3">
              <div class="text-end d-none d-sm-block">
                <span class="badge bg-white text-dark mb-1 fw-bold fs-6" id="investor-wallet-name">Primary Wallet</span>
                <div class="small opacity-75"><code class="text-white" id="investor-wallet-uuid">--</code></div>
              </div>

              <!-- Switch Wallet Dropdown -->
              <div class="dropdown">
                <button class="btn btn-light btn-sm dropdown-toggle fw-semibold d-flex align-items-center gap-1 shadow-sm" type="button" id="walletSwitchDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-wallet2 text-primary"></i>
                  <span>Switch Wallet</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow p-2" id="wallet-switch-menu" aria-labelledby="walletSwitchDropdown" style="min-width: 280px;">
                  <li class="dropdown-header text-uppercase small text-muted"><i class="bi bi-wallet2 me-1"></i>Select Active Wallet</li>
                  <!-- Dynamically populated via investor.js -->
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      
      <!-- 1. View Projects Table Card -->
      <div class="col-lg-7" id="section-projects">
        <div class="card dashboard-card h-100">
          <div class="card-header-custom">
            <span><i class="bi bi-kanban text-primary me-2"></i>Investment Opportunities</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadInvestorProjects()">
              <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-custom align-middle">
                <thead>
                  <tr>
                    <th>Project Name</th>
                    <th>Initial Capital</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="investor-projects-list">
                  <!-- Populated dynamically via investor.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Transaction History Card -->
      <div class="col-lg-5" id="section-transactions">
        <div class="card dashboard-card h-100">
          <div class="card-header-custom">
            <span><i class="bi bi-receipt me-2"></i>Recent Transactions</span>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 380px;">
              <table class="table table-custom align-middle">
                <thead>
                  <tr>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="transactions-list">
                  <!-- Populated dynamically via investor.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Main & Page Scripts -->
  <script src="/static/js/main.js"></script>
  <script src="/static/js/investor.js"></script>
</body>
</html>
